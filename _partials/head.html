<script>
/* Opener gate — must run in <head>, before the body paints, so that on every
   page after the first the loading screen is never even briefly visible.
   Default: once per visit (sessionStorage). Change to localStorage below to
   show it only once, ever, per browser. Add ?opener=1 to any URL to force it. */
(function () {
  try {
    // Force it, for previewing. The hash form also survives hosts that strip
    // query strings on clean-URL redirects (e.g. `npx serve`).
    if (location.search.indexOf("opener=1") > -1) return;
    if (location.hash === "#opener") return;
    var store = window.sessionStorage;                       // <- localStorage = once ever
    if (store.getItem("bernico.opener")) {
      document.documentElement.className += " no-opener";
    } else {
      store.setItem("bernico.opener", "1");
    }
  } catch (e) { /* storage blocked (private mode) — just show it */ }
})();
</script>
</head>
